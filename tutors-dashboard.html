<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutor Dashboard · Academic Central</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<script src="config.js"></script>
<script src="tooltips.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
    margin-top: 4px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 20px;
    text-align: center;
  }
  .stat-card .label { font-size: 0.78rem; font-weight: 600; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.03em; }
  .stat-card .value { font-size: 1.6rem; font-weight: 800; color: var(--blue-dark); margin-top: 6px; }
  .hero {
    background: var(--blue-soft);
    border-radius: 16px;
    padding: 28px 30px;
    margin-bottom: 20px;
  }
  .hero .name { font-size: 1.4rem; font-weight: 800; color: var(--blue-dark); }
  .hero .role-badge {
    display: inline-block; margin-top: 8px;
    background: var(--surface); border: 1px solid var(--blue-line);
    color: var(--blue-dark); font-weight: 600; font-size: 0.85rem;
    padding: 4px 12px; border-radius: 999px;
  }

  input[type="date"] {
    width: 100%;
    margin-top: 6px;
    padding: 11px 13px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 0.95rem;
  }
  input[type="date"]:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px var(--blue-soft);
  }
  .date-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .date-row { grid-template-columns: 1fr; } }
  .optional-tag { font-weight: 400; color: var(--ink-soft); font-size: 0.85rem; }
  .modal { max-height: 90vh; overflow-y: auto; }
  .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
  .absence-item {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px 18px; margin-bottom: 10px;
  }
  .absence-item .who { font-weight: 700; }
  .absence-item .meta { color: var(--ink-soft); font-size: 0.88rem; margin-top: 2px; }
  .absence-item .status { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; margin-top: 8px; }
  .status.pending { color: var(--gold); }
  .status.approved { color: #15803D; }
  .status.denied { color: #B91C1C; }
  .absence-actions { display: flex; gap: 8px; margin-top: 10px; }
  .absence-actions .btn { padding: 8px 14px; font-size: 0.85rem; width: auto; }
</style>
</head>
<body>
  <div class="container">
    <div class="title-bar"><a class="brand" href="home.html"><img class="brand-logo" src="logo.svg" alt=""><span class="brand-name"><span class="bn1" data-brand="first">Academic</span> <span class="bn2" data-brand="second">Central</span></span></a></div>
    <div id="session-bar" style="color:var(--ink-soft); font-size:0.85rem; margin:-6px 0 14px; text-align:right;"></div>

    <div class="hero">
      <div class="name" id="hero-name">—</div>
      <div class="role-badge" id="hero-role">—</div>
    </div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="label">Day Assigned</div>
        <div class="value" id="stat-day">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Room Assigned</div>
        <div class="value" id="stat-room">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Hours Volunteered</div>
        <div class="value" id="stat-hours">—</div>
      </div>
    </div>

    <br>
    <button class="btn secondary" id="absence-btn" type="button">Absence Request</button>
    <button class="btn secondary" id="pw-btn" type="button" style="margin-top:10px;">Change Password</button>

    <div id="my-absences-section" style="margin-top:28px;">
      <div class="subtitle-bar" style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
        <span>My Absence Requests</span>
        <a href="#" id="load-my-absences" style="color:var(--blue-dark); font-size:0.85rem; font-weight:500;">Load my requests</a>
      </div>
      <div id="my-absence-list"></div>
    </div>

    <div id="president-section" class="hidden" style="margin-top:28px;">
      <div class="subtitle-bar" style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
        <span>Absence Requests</span>
        <a href="#" id="load-absences" style="color:var(--blue-dark); font-size:0.85rem; font-weight:500;">Load requests</a>
      </div>
      <div id="absence-list"></div>
    </div>

    <br>
    <a class="back-link" href="home.html">&larr; Back to Home</a>
  </div>

  <div class="modal-overlay hidden" id="absence-modal">
    <div class="modal">
      <h3>Absence Request</h3>

      <form id="absence-form">
        <label for="absence-name">Name:</label>
        <input type="text" id="absence-name" name="absence-name">

        <label>Date(s):</label>
        <div class="date-row">
          <div>
            <label for="absence-date-start" style="margin-top:6px; font-weight:400; font-size:0.85rem; color:var(--ink-soft);">From</label>
            <input type="date" id="absence-date-start" name="absence-date-start">
          </div>
          <div>
            <label for="absence-date-end" style="margin-top:6px; font-weight:400; font-size:0.85rem; color:var(--ink-soft);">To <span class="optional-tag">(leave blank for one day)</span></label>
            <input type="date" id="absence-date-end" name="absence-date-end">
          </div>
        </div>

        <label>Have you found a replacement?</label>
        <div class="check-group">
          <label><input type="radio" name="replacement" value="yes"> Yes</label>
          <label><input type="radio" name="replacement" value="no"> No</label>
        </div>

        <label for="replacement-name">If so, who is it? <span class="optional-tag">(not required)</span></label>
        <input type="text" id="replacement-name" name="replacement-name">

        <div class="modal-actions">
          <button class="btn" type="button" id="absence-submit">Submit</button>
          <button class="btn secondary" type="button" id="absence-cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay hidden" id="pw-modal">
    <div class="modal">
      <h3>Change Password</h3>
      <form id="pw-form" autocomplete="off">
        <label for="pw-old">Current password:</label>
        <input type="password" id="pw-old" autocomplete="current-password">
        <label for="pw-new">New password <span style="font-weight:400;color:var(--ink-soft);font-size:0.85rem;">(at least 8 characters)</span>:</label>
        <input type="password" id="pw-new" autocomplete="new-password">
        <label for="pw-new2">Type the new password again:</label>
        <input type="password" id="pw-new2" autocomplete="new-password">
        <div class="check-group">
          <label><input type="checkbox" id="pw-show"> Show passwords</label>
        </div>
        <div style="display:flex; gap:10px; margin-top:22px;">
          <button class="btn" type="button" id="pw-submit">Save</button>
          <button class="btn secondary" type="button" id="pw-cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

<script>
  const tutorSessionRaw = sessionStorage.getItem('tutor_session');
  if (!tutorSessionRaw) {
    window.location.href = 'tutors.html';
  }
  const tutorSession = JSON.parse(tutorSessionRaw || '{}');

  document.getElementById('session-bar').innerHTML =
    `Logged in as ${tutorSession.username} &nbsp;|&nbsp; ` +
    `<a href="#" id="logout-link" style="color:var(--blue);">Log out</a>`;
  document.getElementById('logout-link').addEventListener('click', (e) => {
    e.preventDefault();
    sessionStorage.removeItem('tutor_session');
    window.location.href = 'home.html';
  });

  document.getElementById('hero-name').textContent = tutorSession.full_name || '—';
  document.getElementById('hero-role').textContent = tutorSession.role || '—';
  document.getElementById('stat-day').textContent = tutorSession.day_assigned || '—';
  document.getElementById('stat-room').textContent = tutorSession.room_assigned || '—';
  document.getElementById('stat-hours').textContent = (tutorSession.hours_volunteered ?? '—');

  const absenceModal = document.getElementById('absence-modal');
  document.getElementById('absence-btn').addEventListener('click', () => {
    absenceModal.classList.remove('hidden');
  });
  document.getElementById('absence-cancel').addEventListener('click', () => {
    absenceModal.classList.add('hidden');
  });

  const SUPABASE_URL = APP_CONFIG.supabaseUrl;
  const SUPABASE_ANON_KEY = APP_CONFIG.supabaseAnonKey;
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.getElementById('absence-name').value = tutorSession.full_name || '';

  document.getElementById('absence-submit').addEventListener('click', async () => {
    const name = document.getElementById('absence-name').value.trim();
    const start = document.getElementById('absence-date-start').value;
    const end = document.getElementById('absence-date-end').value;
    const replacement = (document.querySelector('input[name="replacement"]:checked') || {}).value;
    const replacementName = document.getElementById('replacement-name').value.trim();

    if (!name) { alert('Enter your name.'); return; }
    if (!start) { alert('Pick the date you will be absent.'); return; }
    if (end && end < start) { alert('The "To" date cannot be before the "From" date.'); return; }
    if (!replacement) { alert('Choose Yes or No for replacement.'); return; }

    const row = {
      tutor_username: tutorSession.username,
      tutor_name: name,
      date_start: start,
      date_end: end || null,
      found_replacement: replacement === 'yes',
      replacement_name: (replacement === 'yes' && replacementName) ? replacementName : null
    };

    const { error } = await db.from('absence_requests').insert([row]);
    if (error) { alert('Could not submit request: ' + error.message); console.error(error); return; }

    alert('Absence request sent to the president.');
    if (sessionPassword) loadMyAbsences();
    document.getElementById('absence-form').reset();
    document.getElementById('absence-name').value = tutorSession.full_name || '';
    absenceModal.classList.add('hidden');
  });

  const isPresident = (tutorSession.role || '').trim().toLowerCase() === 'president';
  if (isPresident) document.getElementById('president-section').classList.remove('hidden');

  let sessionPassword = null;

  function askPassword() {
    if (!sessionPassword) sessionPassword = prompt('Enter your password to continue:');
    return sessionPassword;
  }

  async function loadAbsences() {
    const pw = askPassword();
    if (!pw) return;
    const { data, error } = await db.rpc('list_absences', {
      p_username: tutorSession.username, p_password: pw
    });
    const list = document.getElementById('absence-list');
    if (error) {
      sessionPassword = null;
      list.textContent = 'Could not load requests: ' + error.message;
      return;
    }
    list.innerHTML = '';
    if (!data || data.length === 0) {
      list.innerHTML = '<p style="color:var(--ink-soft);">No absence requests yet.</p>';
      return;
    }
    data.forEach(r => {
      const item = document.createElement('div');
      item.className = 'absence-item';

      const who = document.createElement('div');
      who.className = 'who';
      who.textContent = r.tutor_name;

      const meta = document.createElement('div');
      meta.className = 'meta';
      const dates = r.date_end ? `${r.date_start} to ${r.date_end}` : r.date_start;
      const replacementText = r.found_replacement
        ? 'Replacement: ' + (r.replacement_name || 'yes (name not given)')
        : 'No replacement found';
      meta.textContent = `${dates} · ${replacementText}`;

      const status = document.createElement('div');
      status.className = 'status ' + r.status;
      status.textContent = r.status;

      item.append(who, meta, status);

      if (r.status === 'pending') {
        const actions = document.createElement('div');
        actions.className = 'absence-actions';
        ['approved', 'denied'].forEach(decision => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = decision === 'approved' ? 'btn' : 'btn secondary';
          b.textContent = decision === 'approved' ? 'Approve' : 'Deny';
          b.addEventListener('click', async () => {
            const { error: decErr } = await db.rpc('decide_absence', {
              p_username: tutorSession.username, p_password: sessionPassword,
              p_id: r.id, p_status: decision
            });
            if (decErr) { alert('Could not update: ' + decErr.message); return; }
            loadAbsences();
          });
          actions.appendChild(b);
        });
        item.appendChild(actions);
      }
      list.appendChild(item);
    });
  }

  document.getElementById('load-absences').addEventListener('click', (e) => {
    e.preventDefault();
    loadAbsences();
  });

  async function loadMyAbsences() {
    const pw = askPassword();
    if (!pw) return;
    const { data, error } = await db.rpc('my_absences', {
      p_username: tutorSession.username, p_password: pw
    });
    const list = document.getElementById('my-absence-list');
    if (error) {
      sessionPassword = null;
      list.textContent = 'Could not load your requests: ' + error.message;
      return;
    }
    list.innerHTML = '';
    if (!data || data.length === 0) {
      list.innerHTML = '<p style="color:var(--ink-soft);">You have not submitted any absence requests.</p>';
      return;
    }
    data.forEach(r => {
      const item = document.createElement('div');
      item.className = 'absence-item';

      const who = document.createElement('div');
      who.className = 'who';
      who.textContent = r.date_end ? `${r.date_start} to ${r.date_end}` : r.date_start;

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = r.found_replacement
        ? 'Replacement: ' + (r.replacement_name || 'yes (name not given)')
        : 'No replacement found';

      const status = document.createElement('div');
      status.className = 'status ' + r.status;
      status.textContent = r.status === 'pending' ? 'pending — waiting for the president' : r.status;

      item.append(who, meta, status);
      list.appendChild(item);
    });
  }

  document.getElementById('load-my-absences').addEventListener('click', (e) => {
    e.preventDefault();
    loadMyAbsences();
  });

  (function () {
    const modal = document.getElementById('pw-modal');
    const ids = ['pw-old', 'pw-new', 'pw-new2'];
    function closePw() {
      modal.classList.add('hidden');
      document.getElementById('pw-form').reset();
      ids.forEach(id => { document.getElementById(id).type = 'password'; });
    }
    document.getElementById('pw-btn').addEventListener('click', () => modal.classList.remove('hidden'));
    document.getElementById('pw-cancel').addEventListener('click', closePw);
    document.getElementById('pw-show').addEventListener('change', function () {
      ids.forEach(id => { document.getElementById(id).type = this.checked ? 'text' : 'password'; });
    });
    document.getElementById('pw-submit').addEventListener('click', async () => {
      const oldPw = document.getElementById('pw-old').value.trim();
      const newPw = document.getElementById('pw-new').value.trim();
      const newPw2 = document.getElementById('pw-new2').value.trim();
      if (!oldPw) { alert('Enter your current password.'); return; }
      if (newPw.length < 8) { alert('The new password must be at least 8 characters.'); return; }
      if (newPw !== newPw2) { alert('The two new passwords do not match.'); return; }
      if (newPw === oldPw) { alert('Choose a password different from your current one.'); return; }
      const { error } = await db.rpc('change_password', {
        p_kind: 'tutor', p_username: tutorSession.username, p_old_password: oldPw, p_new_password: newPw
      });
      if (error) { alert(error.message); return; }
      sessionPassword = null;
      closePw();
      alert('Password changed. Use the new one next time you sign in.');
    });
  })();

  addInfoTips({
    'absence-btn': 'Let your Room Lead and the President know you\'ll be out, and optionally name a replacement.',
    'pw-btn': 'Change the password you use to sign in here and on the sign-in sheet.',
    'absence-submit': 'Sends your absence request to the President for approval. You can check its status under "My Absence Requests" below.',
    'load-my-absences': 'Shows the status (pending / approved / denied) of every absence request you\'ve submitted. Asks for your password the first time.',
    'load-absences': 'President only: shows every tutor\'s absence requests so you can approve or deny them. Asks for your password the first time.',
    'absence-date-start': 'The first day you\'ll be absent.',
    'absence-date-end': 'The last day you\'ll be absent, if this covers more than one day.',
    'replacement-name': 'Who is covering for you, if you found someone.'
  });
</script>
</body>
</html>
