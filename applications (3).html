<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutor Applications</title>
<link rel="stylesheet" href="style.css">
<script src="tooltips.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  .scroll-checklist {
    max-height: 220px; overflow-y: auto; margin-top: 6px;
    border: 1px solid var(--line); border-radius: 10px; padding: 4px 0;
    background: var(--surface);
  }
  .scroll-checklist .group-label {
    padding: 6px 14px; font-size: 0.75rem; font-weight: 700; color: var(--ink-soft);
    background: var(--bg); text-transform: uppercase;
  }
  .scroll-checklist label {
    display: flex; align-items: center; gap: 8px; font-weight: 400;
    padding: 6px 14px; margin: 0; font-size: 0.92rem;
  }
  .scroll-checklist input { width: auto; }
  #subject-grades-section { margin-top: 16px; }
  .grades-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  .grades-table th, .grades-table td { border-bottom: 1px solid var(--line); padding: 8px; text-align: left; font-size: 0.88rem; }
  .grades-table select { width: 100%; }
</style>
</head>
<body>
  <div class="container">
    <div class="title-bar">Academic Central</div>
    <div class="subtitle-bar">Tutor Applications</div>

    <form class="panel" id="app-form">
      <label for="fullname">Full Name:</label>
      <input type="text" id="fullname" required>

      <label for="scholar-username">Scholar Username:</label>
      <input type="text" id="scholar-username" required>

      <label for="grade">Grade:</label>
      <select id="grade" required>
        <option value="">Select grade...</option>
        <option>8</option><option>9</option><option>10</option><option>11</option><option>12</option>
      </select>

      <label for="gpa">Weighted GPA:</label>
      <input type="number" id="gpa" step="0.01" min="0" max="5" required>

      <label>Subjects Passed:<span class="info-icon" tabindex="0" data-tip="Check every subject you've already passed, even outside this program. Checking a subject reveals a row below to record which teacher and grade you earned it with.">i</span></label>
      <div class="scroll-checklist" id="subjects-checklist"></div>

      <div id="subject-grades-section" class="hidden">
        <label style="margin-top:0;">Subject Grades:</label>
        <table class="grades-table">
          <thead><tr><th>Subject</th><th>Teacher</th><th>Course Grade</th></tr></thead>
          <tbody id="subject-grades-body"></tbody>
        </table>
      </div>

      <label>Teacher Recommendation:<span class="info-icon" tabindex="0" data-tip="Check any teacher who can vouch for you as a tutor. They'll be asked to review your application before it's finalized.">i</span></label>
      <div class="scroll-checklist" id="teachers-checklist"></div>
    </form>

    <br>
    <button class="btn" id="app-submit-btn" type="submit" form="app-form">Submit</button>
    <br><br>
    <a class="back-link" href="home.html">&larr; Back to Home</a>
  </div>

<script>
  const SUPABASE_URL = 'https://qdjgnxvomzukvsxjrhen.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkamdueHZvbXp1a3ZzeGpyaGVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMzU5OTUsImV4cCI6MjEwNTYxMTk5NX0.H_Qc5zuK1TMslOFuFTXa0rZg-JVDJZtuvanQySwkD84';
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const CLASS_GROUPS = {
    'Math': ['Pre-Algebra', 'Algebra 1', 'Algebra 2', 'Geometry', 'Precalc/Trig', 'AP Precalc', 'Calculus', 'AP Calc AB', 'AP Calc BC', 'AP Stats'],
    'English': ['7 English', '8 English', 'English I', 'English II', 'English III w/ Personal Comm', 'AP Lang', 'AP Lit', 'AP Seminar', 'AP Research', 'Journalism'],
    'Science': ['7 Science', '8 Science', 'Physical Science', 'Physics', 'AP Physics C', 'Biology', 'AP Bio', 'AP Environmental Science', 'Chemistry', 'Chemistry 2', 'Chemistry of Foods'],
    'Computer Science': ['8 KC', 'Intro to Comp Sci', 'AP CSP', 'AP CSA', 'Game Development'],
    'Social Studies': ['7 SS', '8 SS', 'Civics/Econ', 'AP US Gov', 'AP Micro/Macro', 'Intro to Crim', 'CSI', 'World History', 'AP World', 'US History', 'APUSH', 'AP Psych', 'AP Business'],
    'Health Sciences': ['7 Career', '7 Health', '7 PE', '8 Health', '8 PE', 'Health', 'A&P', 'Med Term', 'Recreational Sports', 'College & Career', 'Personal Fitness'],
    'Fine Arts': ['7 Theatre', '7 Art', '8 Art', 'Drawing 1', 'Painting 1', 'Visual Art Foundations 1', 'Sculpture', 'Studio Art', 'AP Art History'],
    'World Languages': ['Spanish 1', 'Spanish 2', 'Spanish 3', 'AP Spanish Lang', 'French 3', 'AP French Lang']
  };

  // Teacher last names are pulled live from the admins table (Supabase)
  // instead of being hardcoded, so the list always matches who's actually
  // an admin/teacher in the system.
  let TEACHERS = [];
  async function loadTeachers() {
    const { data, error } = await db.rpc('list_admins');
    if (error || !data) { console.error(error); return []; }
    const names = [...new Set(data.map(r => (r.full_name || '').trim().split(' ').slice(-1)[0]).filter(Boolean))];
    names.sort();
    return names;
  }

  const subjectsChecklist = document.getElementById('subjects-checklist');
  Object.entries(CLASS_GROUPS).forEach(([groupName, items]) => {
    const label = document.createElement('div');
    label.className = 'group-label';
    label.textContent = groupName;
    subjectsChecklist.appendChild(label);
    items.forEach(item => {
      const row = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.value = item; cb.className = 'subject-checkbox';
      cb.addEventListener('change', updateSubjectGradesTable);
      row.appendChild(cb);
      row.appendChild(document.createTextNode(' ' + item));
      subjectsChecklist.appendChild(row);
    });
  });

  const teachersChecklist = document.getElementById('teachers-checklist');
  (async function () {
    TEACHERS = await loadTeachers();
    teachersChecklist.innerHTML = '';
    if (TEACHERS.length === 0) {
      teachersChecklist.innerHTML = '<label style="color:var(--ink-soft);">Could not load teacher list.</label>';
      return;
    }
    TEACHERS.forEach(t => {
      const row = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.value = t; cb.className = 'teacher-checkbox';
      row.appendChild(cb);
      row.appendChild(document.createTextNode(' ' + t));
      teachersChecklist.appendChild(row);
    });
  })();

  function buildTeacherSelect() {
    const sel = document.createElement('select');
    TEACHERS.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t; opt.textContent = t;
      sel.appendChild(opt);
    });
    return sel;
  }

  function buildGradeSelect() {
    const sel = document.createElement('select');
    ['A', 'B', 'C'].forEach(g => {
      const opt = document.createElement('option');
      opt.value = g; opt.textContent = g;
      sel.appendChild(opt);
    });
    return sel;
  }

  function updateSubjectGradesTable() {
    const checked = Array.from(document.querySelectorAll('.subject-checkbox:checked')).map(cb => cb.value);
    const section = document.getElementById('subject-grades-section');
    const body = document.getElementById('subject-grades-body');

    if (checked.length === 0) {
      section.classList.add('hidden');
      body.innerHTML = '';
      return;
    }
    section.classList.remove('hidden');

    // Preserve existing selections for subjects still checked; rebuild otherwise
    const existing = {};
    body.querySelectorAll('tr').forEach(tr => {
      const subj = tr.dataset.subject;
      existing[subj] = {
        teacher: tr.querySelector('.teacher-select').value,
        grade: tr.querySelector('.course-grade-select').value
      };
    });

    body.innerHTML = '';
    checked.forEach(subject => {
      const tr = document.createElement('tr');
      tr.dataset.subject = subject;
      const subjTd = document.createElement('td');
      subjTd.textContent = subject;

      const teacherTd = document.createElement('td');
      const teacherSel = buildTeacherSelect();
      teacherSel.className = 'teacher-select';
      if (existing[subject]) teacherSel.value = existing[subject].teacher;
      teacherTd.appendChild(teacherSel);

      const gradeTd = document.createElement('td');
      const gradeSel = buildGradeSelect();
      gradeSel.className = 'course-grade-select';
      if (existing[subject]) gradeSel.value = existing[subject].grade;
      gradeTd.appendChild(gradeSel);

      tr.append(subjTd, teacherTd, gradeTd);
      body.appendChild(tr);
    });
  }

  document.getElementById('app-form').addEventListener('submit', async function (e) {
    e.preventDefault();

    const subjectsPassed = Array.from(document.querySelectorAll('.subject-checkbox:checked')).map(cb => cb.value);
    const teacherRecs = Array.from(document.querySelectorAll('.teacher-checkbox:checked')).map(cb => cb.value);

    if (subjectsPassed.length === 0) { alert('Select at least one subject passed.'); return; }
    if (teacherRecs.length === 0) { alert('Select at least one teacher recommendation.'); return; }

    const subjectGrades = Array.from(document.querySelectorAll('#subject-grades-body tr')).map(tr => ({
      subject: tr.dataset.subject,
      teacher: tr.querySelector('.teacher-select').value,
      grade: tr.querySelector('.course-grade-select').value
    }));

    const row = {
      full_name: document.getElementById('fullname').value.trim(),
      scholar_username: document.getElementById('scholar-username').value.trim(),
      grade: document.getElementById('grade').value,
      gpa: parseFloat(document.getElementById('gpa').value),
      subjects_passed: subjectsPassed,
      subject_grades: subjectGrades,
      teacher_recommendations: teacherRecs
    };

    const { error } = await db.from('applications').insert([row]);
    if (error) {
      alert('Could not submit application: ' + error.message);
      console.error(error);
      return;
    }
    alert('Application submitted!');
    e.target.reset();
    document.getElementById('subject-grades-section').classList.add('hidden');
    document.getElementById('subject-grades-body').innerHTML = '';
  });

  addInfoTips({
    'fullname': 'Your full legal name, as you\'d like it to appear on tutor records.',
    'scholar-username': 'Your existing scholar username (the one you log in with as a student), if this program issued you one.',
    'grade': 'Your current grade level. Tutors must be in grade 8 or above.',
    'gpa': 'Your current weighted GPA, as it appears on your transcript.',
    'app-submit-btn': 'Sends your application to the teachers you checked under Teacher Recommendation. An admin will finalize your tutor account once enough of them respond.'
  });
</script>
</body>
</html>
